qlib:
  provider_uri: ./data/qlib_data_cn
  region: cn

universe: all

time:
  train: [ "2022-01-01", "2023-12-31" ]
  valid: [ "2024-01-01", "2024-12-31" ]
  test:  [ "2025-01-01", "2025-12-31" ]


features:
  handler: Alpha158
  lookback: 20
  use_valuation: True

model:
  name: lstm
  hidden_size: 64
  num_layers: 2
  dropout: 0.2
  lr: 0.0005
  epochs: 200
  early_stop: 10
  batch_size: 4096
  n_jobs: 8
  loss: pearson

strategy:
  topk: 2   # 30
  n_drop: 2 # 5

backtest:
  cost:
    buy: 0.001
    sell: 0.002
